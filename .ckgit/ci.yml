#
# Automated CI/CD, Dual-OS media verification, and ckdocs portal publication on ckgit@rpi4:
#   - Every push to main builds all native C/C++20 tools, runs unit tests,
#     verifies auto-generated Markdown docs (ckdist gen-docs --check), builds all
#     60 MS-DOS 4.00 directories (verifying all 654 SHA-256 manifest hashes),
#     builds CK-DOS 5.0 (including CK Basic QBASIC.EXE, CK Edit EDIT.COM, CK Help
#     HELP.COM, HIMEM.SYS, DOSKEY.COM) + 10 16-bit self-hosting DOS tools,
#     packages all release media + native SDK archives, boot-tests all 8 bootable
#     images in headless QEMU, builds the two-site ckdocs portal (CK-DOS 5.0 &
#     CK-DOS 4.0) with --strict, and publishes ck-pages.
#   - Pushing a tag vMAJOR.MINOR.PATCH matching VERSION publishes durable
#     release bundles across Linux arm64 and Windows x64.
version: 2
on:
  branches: [main]
  tags: [v*]
jobs:
  - name: linux-arm64
    runs_on: [linux]
    steps:
      - name: build-and-test
        script: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          case "${CKGIT_REF:-}" in
            refs/tags/*)
              tag=${CKGIT_REF#refs/tags/}
              if [ "$tag" != "v$version" ]; then
                echo "tag $tag does not match VERSION $version" >&2
                exit 1
              fi
              ;;
          esac
          cmake -G Ninja -S "$PWD" -B "$TMPDIR/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$TMPDIR/build" --config Release --parallel 4
          ctest --test-dir "$TMPDIR/build" --output-on-failure
          "$TMPDIR/build/ckdist" gen-docs --repo-root "$PWD" --check
      - name: package-dos-and-sdk
        script: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          "$TMPDIR/build/ckdist" release \
            --os all \
            --repo-root "$PWD" \
            --tool-dir "$TMPDIR/build" \
            --verify-manifest "$PWD/docs/build-manifest.json" \
            --output "$PWD/dist" \
            --version "$version" \
            --platform linux-arm64
      - name: verify-boot-media-in-qemu
        script: |
          set -eu
          "$TMPDIR/build/ckdist" verify-boot --os all --dist-dir "$PWD/dist"
      - name: build-ckdocs-portal
        script: |
          set -eu
          rm -rf "$PWD/public"
          ckdocs build --root "$PWD" --out "$PWD/public" --clean --strict
          mkdir -p "$PWD/public/downloads"
          for asset in ckdos-5.00-floppy-1440k.img ckdos-5.00-files.zip ckdos-4.00-floppy-1440k.img ckdos-4.00-files.zip SHA256SUMS; do
            if [ -f "$PWD/dist/$asset" ]; then
              cp "$PWD/dist/$asset" "$PWD/public/downloads/$asset"
            fi
          done
    artifacts:
      name: dos-media-and-linux-arm64-sdk
      paths: [dist]
  - name: windows-x64
    runs_on: [windows, x64]
    steps:
      - name: build-and-package-windows-sdk
        run: [cmake.exe, -P, packaging/windows/build-ci.cmake]
    artifacts:
      name: windows-x64-sdk
      paths: [dist]
pages:
  path: public
  job: linux-arm64
