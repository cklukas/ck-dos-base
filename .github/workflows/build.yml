name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Full MS-DOS 4.00 build & manifest verification (native ckdist)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ -f build/Release/ckdist.exe ]; then
            CKDIST=build/Release/ckdist.exe
          elif [ -f build/ckdist.exe ]; then
            CKDIST=build/ckdist.exe
          elif [ -f build/Release/ckdist ]; then
            CKDIST=build/Release/ckdist
          else
            CKDIST=build/ckdist
          fi
          "$CKDIST" verify-build --repo-root . --verify-manifest docs/build-manifest.json

      - name: Install native package
        run: cmake --install build --config Release

      - name: Upload native tools
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ck-dos-base-tools-${{ runner.os }}-${{ runner.arch }}
          path: package/
          if-no-files-found: error

  dos-release-media:
    name: DOS release media & QEMU boot
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install QEMU x86
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Build native tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Build all DOS media & verify QEMU boot
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./build/ckdist release \
            --repo-root . \
            --tool-dir build \
            --verify-manifest docs/build-manifest.json \
            --output dist \
            --platform linux-x64
          ./build/ckdist verify-boot --dist-dir dist
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload DOS release media
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ckdos-4.00-release-media
          path: dist/
          if-no-files-found: error
