name: Build native tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Full source build & manifest verification
        shell: bash
        run: |
          if [ -d build/Release ]; then
            TOOL_DIR=build/Release
          else
            TOOL_DIR=build
          fi
          python3 scripts/verify_full_build.py --tool-dir "$TOOL_DIR" --verify-manifest docs/build-manifest.json

      - name: Install native package
        run: cmake --install build --config Release

      - name: Upload native tools
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ck-dos-base-tools-${{ runner.os }}-${{ runner.arch }}
          path: package/
          if-no-files-found: error
