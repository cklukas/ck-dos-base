name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CKDOCS_REPOSITORY: cklukas/ck-git-hosting
  CKDOCS_VERSION: 0.11.0
  CKDOCS_SHA256: f3166afa2f12b69503e248a08b8c0313a1331f3e481b7c5f380db03eef64c8a6

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify generated documentation & Full CK-DOS 4.0 / 5.0 build
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ -f build/Release/ckdist.exe ]; then
            CKDIST=build/Release/ckdist.exe
          elif [ -f build/ckdist.exe ]; then
            CKDIST=build/ckdist.exe
          elif [ -f build/Release/ckdist ]; then
            CKDIST=build/Release/ckdist
          else
            CKDIST=build/ckdist
          fi
          "$CKDIST" gen-docs --repo-root . --check
          "$CKDIST" verify-build --os all --repo-root . --verify-manifest docs/build-manifest.json

      - name: Install native package
        run: cmake --install build --config Release

      - name: Upload native tools
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ck-dos-base-tools-${{ runner.os }}-${{ runner.arch }}
          path: package/
          if-no-files-found: error

  dos-release-media:
    name: DOS release media, QEMU boot & ckdocs check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install QEMU x86 & ckdocs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          deb="$RUNNER_TEMP/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          curl --fail --location --silent --show-error --retry 3 --output "$deb" \
            "https://github.com/$CKDOCS_REPOSITORY/releases/download/v$CKDOCS_VERSION/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          echo "$CKDOCS_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
          ckdocs --version

      - name: Validate two-site ckdocs documentation portal (--strict)
        run: ckdocs check --root "$PWD"

      - name: Build native tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Build all CK-DOS 4.0 & 5.0 media & verify QEMU boot
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          ./build/ckdist gen-docs --repo-root . --check
          ./build/ckdist release \
            --os all \
            --repo-root . \
            --tool-dir build \
            --verify-manifest docs/build-manifest.json \
            --output dist \
            --platform linux-x64
          ./build/ckdist verify-boot --os all --dist-dir dist
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload DOS release media
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ckdos-release-media
          path: dist/
          if-no-files-found: error
